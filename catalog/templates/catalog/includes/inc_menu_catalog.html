<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Продуктовый магазин</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_list' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_create' %}">Добавить продукт</a>

        <!-- Выпадающий список категорий -->
        <div class="dropdown d-inline">
            <button class="p-2 btn btn-outline-primary dropdown-toggle" type="button" id="categoriesDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                Категории
            </button>
        <ul class="dropdown-menu" aria-labelledby="categoriesDropdown">
            {% for category in categories %}
            <li>
                <a class="dropdown-item" href="{% url 'catalog:category_products' category.id %}">
                    {{ category.name }}
                </a>
            </li>
            {% empty %}
            <li><span class="dropdown-item-text">Нет категорий</span></li>
            {% endfor %}
        </ul>
        </div>

        {% if user.is_authenticated %}
        <form method="post" action="{% url 'users:logout' %}" style="display: inline">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-danger">Выйти</button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
