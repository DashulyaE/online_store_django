{% extends 'blogs/base.html' %}
{% load my_tags %}
{% block content %}
<div class="row mb-2">
    <div class="col-md-6">
      <div class="row g-0 border rounded overflow-hidden flex-md-row mb-4 shadow-sm h-md-250 position-relative">
        <div class="col p-4 d-flex flex-column position-static">
          <h3 class="mb-0">{{ blog.title }}</h3>
          <div class="mb-1 text-body-secondary">{{ blog.created_at }}</div>
          <p class="card-text mb-auto">{{ blog.content }}</p>

        <div class="col-auto d-none d-lg-block">

            <img src="{{ blog.preview | media_filter }}" class="img-fluid">

        </div>
            <a href="{% url 'blogs:blog_list' %}" class="icon-link gap-1 icon-link-hover stretched-link">
Назад
        <svg class="bi" aria-hidden="true"></svg> </a>
      </div>
    </div>
</div>
{% endblock %}
